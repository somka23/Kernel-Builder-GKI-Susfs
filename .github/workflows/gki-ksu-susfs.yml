name: Pixel 8 (Shusky) Kernel Builder CI
run-name: "Build Pixel 8 Kernel: ${{ inputs.build_name }} [${{ github.ref_name }}]"
on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Build Name"
        required: true
        type: string

      target_version:
        description: "Kernel Version (Pixel 8 uses 6.1-based)"
        required: false
        type: string
        default: "6.1"

      root_manager:
        description: "Root Environment"
        required: false
        type: choice
        options:
          - KernelSU-Next
          - SukiSU-Ultra
          - BakaSU
          - ReSukiSU
          - KernelSU
          - Stock
        default: "KernelSU"

      enable_ksu_susfs:
        description: "Integrate Root Manager and SUSFS?"
        required: false
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MANIFEST_URL: https://android.googlesource.com/kernel/manifest
  PIXEL_8_DEVICE: "shusky"
  PIXEL_8_MANIFEST_BRANCH: "android-gs-shusky-6.1-android16"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Create Manual 16GB Swap File
        run: |
          echo "=== Freeing up any existing partial swap ==="
          sudo swapoff -a
          if [ -f /swapfile ]; then sudo rm -f /swapfile; fi

          echo "=== Allocating 16GB Swap ==="
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "=== Verified Memory Configuration ==="
          free -h

      - name: Setup repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync Pixel 8 kernel source (Shusky)
        run: |
          set -euo pipefail
          rm -rf kernel_workspace && mkdir -p kernel_workspace && cd kernel_workspace
          
          echo ">>> Initializing Pixel 8 (Shusky) manifest..."
          repo init -u "$MANIFEST_URL" -b "$PIXEL_8_MANIFEST_BRANCH" --depth=1
          
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo ">>> Running repo sync for Pixel 8 (Attempt $i of $MAX_RETRIES)..."
            
            if repo sync -c --no-tags --no-clone-bundle --current-branch -j$(nproc); then
              echo ">>> Repo sync successful!"
              break
            else
              if [ $i -eq $MAX_RETRIES ]; then
                echo ">>> Repo sync completely failed after $MAX_RETRIES attempts. Aborting."
                exit 1
              fi
              echo ">>> Sync connection dropped. Waiting 15 seconds before retrying..."
              sleep 15
            fi
          done

          # Capture the PURE Google hash AND the official Unix timestamp
          cd common
          echo "OFFICIAL_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "OFFICIAL_DATE=$(git log -1 --format=%ct)" >> $GITHUB_ENV
          echo ">>> Captured Hash: $(git rev-parse --short HEAD)"
          echo ">>> Captured Date: $(git log -1 --format=%ct)"

      - name: Configure Build Channels
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        run: |
          echo "=== Configuring Build Channel for Root Manager: ${{ inputs.root_manager }} ==="

          case "${{ inputs.root_manager }}" in
            "KernelSU-Next")
              echo "UPSTREAM_REPO=KernelSU-Next/KernelSU-Next" >> $GITHUB_ENV
              echo "TARGET_BRANCH=dev" >> $GITHUB_ENV
              ;;
            "SukiSU-Ultra")
              echo "UPSTREAM_REPO=SukiSU-Ultra/SukiSU-Ultra" >> $GITHUB_ENV
              echo "TARGET_BRANCH=main" >> $GITHUB_ENV
              ;;
            "BakaSU")
              echo "UPSTREAM_REPO=Baka-SU/BakaSU" >> $GITHUB_ENV
              echo "TARGET_BRANCH=main" >> $GITHUB_ENV
              ;;
            "ReSukiSU")
              echo "UPSTREAM_REPO=ReSukiSU/ReSukiSU" >> $GITHUB_ENV
              echo "TARGET_BRANCH=main" >> $GITHUB_ENV
              ;;
            "KernelSU"|*)
              echo "UPSTREAM_REPO=tiann/KernelSU" >> $GITHUB_ENV
              echo "TARGET_BRANCH=main" >> $GITHUB_ENV
              ;;
          esac

          # For Pixel 8, use stable SUSFS branch
          echo "SUSFS_REPO_URL=https://gitlab.com/shoey63/susfs4ksu.git" >> $GITHUB_ENV
          echo "SUSFS_BRANCH=gki-android16-6.1-dev" >> $GITHUB_ENV
          echo "KSU_VARIANT_REPO_URL=https://github.com/shoey63/${{ inputs.root_manager }}.git" >> $GITHUB_ENV
          echo "KSU_VARIANT_REF=stable" >> $GITHUB_ENV

      - name: Integrate Root Manager (${{ inputs.root_manager }})
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        env:
          KSU_VARIANT_REPO_URL: ${{ env.KSU_VARIANT_REPO_URL }}
          KSU_VARIANT_REF: ${{ env.KSU_VARIANT_REF }}
          BUILD_CHANNEL: "stable"
          INTEGRATE_SUSFS: ${{ inputs.enable_ksu_susfs }}
        run: |
          bash ./scripts/inject_ksu_variant.sh "${{ inputs.root_manager }}"

      - name: Integrate SUSFS (Pixel 8 - common/ subdirectory)
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        run: |
          cd kernel_workspace
          
          [ -d common ] || { echo "[-] common/ not found in kernel_workspace" >&2; exit 1; }
          
          echo ">>> Cloning susfs4ksu for Pixel 8..."
          SUSFS_BRANCH="${{ env.SUSFS_BRANCH }}"
          SUSFS_URL="${{ env.SUSFS_REPO_URL }}"
          
          # Clone with branch fallback
          if ! git clone --depth=1 -b "${SUSFS_BRANCH}" "${SUSFS_URL}" susfs4ksu; then
              echo "[-] Branch '${SUSFS_BRANCH}' not found. Attempting fallback..."
              FALLBACK_BRANCH="${SUSFS_BRANCH%-dev}"
              
              if [ "${SUSFS_BRANCH}" = "${FALLBACK_BRANCH}" ]; then
                  echo "[-] Error: Clone failed and no '-dev' suffix to fallback from. Exiting." >&2
                  exit 1
              fi
              
              echo ">>> Trying fallback branch: '${FALLBACK_BRANCH}'..."
              git clone --depth=1 -b "${FALLBACK_BRANCH}" "${SUSFS_URL}" susfs4ksu || {
                  echo "[-] Error: Fallback branch '${FALLBACK_BRANCH}' also failed. Exiting." >&2
                  exit 1
              }
          fi
          
          COMMON_PATCH_SRC="$(find susfs4ksu/kernel_patches -maxdepth 1 -type f -name '50_add_susfs_in_*.patch' | head -n1)"
          [ -n "${COMMON_PATCH_SRC}" ] || { echo "[-] Could not find 50_add_susfs_in_*.patch" >&2; exit 1; }
          
          echo ">>> Copying SUSFS files into common/..."
          cp -f "${COMMON_PATCH_SRC}" common/
          cp -rf susfs4ksu/kernel_patches/fs/* common/fs/
          cp -rf susfs4ksu/kernel_patches/include/linux/* common/include/linux/
          
          echo ">>> Applying SUSFS patch in common/ directory (required for Pixel kernel structure)..."
          # Critical: Change to common/ directory before patching
          (cd common && patch -p1 --no-backup-if-mismatch < "$(basename "${COMMON_PATCH_SRC}")") || true
          
          echo ">>> SUSFS integration complete for Pixel 8!"

      - name: Fix SUSFS Patch Rejections
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        run: |
          bash ./scripts/fix_susfs_rejections.sh

      - name: Configure Kconfigs and Fragments
        run: |
          chmod +x scripts/configure_kconfigs.sh
          ./scripts/configure_kconfigs.sh

      - name: Build Pixel 8 Kernel (Bazel)
        env:
          ROOT_MANAGER: ${{ inputs.root_manager }}
          OFFICIAL_HASH: ${{ env.OFFICIAL_HASH }}
          OFFICIAL_DATE: ${{ env.OFFICIAL_DATE }}
        run: |
          cd kernel_workspace
          mkdir -p ../out out/dist
          
          echo "=== Initializing Pixel 8 Bazel Build Engine ==="
          
          # Mark repo as clean
          git -C common ls-files -m | xargs -r git -C common update-index --assume-unchanged
          
          echo ">>> Building Pixel 8 Kernel with Bazel (Kleaf)..."
          
          # Pixel 8 uses Bazel build system with shusky target
          tools/bazel run --config=stamp \
            --notrim \
            --action_env=SOURCE_DATE_EPOCH="${{ env.OFFICIAL_DATE }}" \
            --action_env=STABLE_BUILD_VERSION="-g${{ env.OFFICIAL_HASH }}" \
            --action_env=KLEAF_KERNEL_BUILD_VERSION="-g${{ env.OFFICIAL_HASH }}" \
            --action_env=KLEAF_SKIP_ABI_CHECKS=true \
            --action_env=KLEAF_USER=android-build \
            //private/devices/google/shusky:shusky_dist \
            -- \
            --destdir=out/dist
          
          echo ">>> Bazel build completed!"

      - name: Extract Kernel Image
        run: |
          cd kernel_workspace
          
          echo ">>> Locating compiled kernel Image..."
          IMAGE_PATH="$(find out/dist -type f -name 'Image' -print -quit)"
          if [ -z "${IMAGE_PATH}" ] || [ ! -f "${IMAGE_PATH}" ]; then
            echo "[-] No compilation Image produced!" >&2
            exit 1
          fi
          
          echo ">>> Selected Image: ${IMAGE_PATH}"
          cp -f "${IMAGE_PATH}" ../out/Image
          
          echo ">>> Extracting kernel runtime version string..."
          KERNEL_VERSION_STRING=$(strings ../out/Image | grep -E "Linux version [0-9]" | head -n 1 || true)
          
          if [ -z "$KERNEL_VERSION_STRING" ]; then
              KERNEL_VERSION_STRING=$(strings ../out/Image | grep -i "Linux version" | head -n 1 || true)
          fi
          
          if [ -n "$KERNEL_VERSION_STRING" ]; then
              echo "    $KERNEL_VERSION_STRING"
          else
              echo "    [!] Notice: Could not read raw banner string directly from compiled Image binary."
          fi

      - name: Prepare Final Artifacts
        run: |
          mkdir -p out/final
          echo -e "DEVICE=shusky\nMANIFEST_BRANCH=$PIXEL_8_MANIFEST_BRANCH\nTIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > out/final/pixel8_metadata.txt
          
          # Sanitize inputs.build_name
          SAFE_BUILD_NAME=$(echo "${{ inputs.build_name }}" | tr ' /' '__')
          
          AK3_REPO="https://github.com/shoey63/AnyKernel3.git"
          AK3_BRANCH="master"
          
          echo ">>> Preparing AnyKernel3 flashable zip for Pixel 8..."
          
          git clone --depth=1 -b "$AK3_BRANCH" "$AK3_REPO" AnyKernel3-Builder
          rm -rf AnyKernel3-Builder/.git AnyKernel3-Builder/README.md AnyKernel3-Builder/*placeholder
          cp -f out/Image AnyKernel3-Builder/
          
          cd AnyKernel3-Builder
          zip -r9 "../out/final/Pixel8-${{ inputs.root_manager }}-${{ inputs.target_version }}-AK3.zip" *
          cd ..
          
          echo "ARTIFACT_NAME=Pixel8-${SAFE_BUILD_NAME}" >> $GITHUB_ENV
          
          echo ">>> Final Artifact Directory:"
          ls -lah out/final/

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/final/
          if-no-files-found: error

      - name: Fetch Manager APK
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        id: fetch_manager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARIANT: ${{ inputs.root_manager }}
        run: |
          chmod +x scripts/fetch_manager.sh
          ./scripts/fetch_manager.sh "$VARIANT" "$GH_TOKEN" "" || true

      - name: Upload Manager APK
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true && hashFiles('manager_apk/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.root_manager }}-Manager
          path: manager_apk/*.apk
          if-no-files-found: warn
